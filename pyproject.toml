[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-audit"
version = "0.1.0"
description = "Model-visible = Logged runtime invariant for LLM applications (zero-dependency audit trail)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "YYW0228" }]
keywords = ["llm", "audit", "compliance", "observability", "agent"]

[tool.setuptools]
py-modules = ["llm_audit"]
